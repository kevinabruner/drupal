- name: Deploy bootstrap script
  ansible.builtin.template:
    src: kevin-bootstrap.sh
    dest: /usr/local/bin/kevin-bootstrap.sh
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy systemd first-boot service
  ansible.builtin.template:
    src: kevin-bootstrap.service.j2
    dest: /etc/systemd/system/kevin-bootstrap.service
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable and link systemd first-boot service
  ansible.builtin.systemd_service:
    name: kevin-bootstrap.service
    enabled: true
    daemon_reload: true
    force: true
  become: true

- name: Deploy bash aliases
  ansible.builtin.template:
    src: bash_aliases
    dest: /home/kevin/.bash_aliases
    owner: kevin
    group: kevin
    mode: '0644'
  become: true