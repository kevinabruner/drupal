- name: Ensure VM is fully ready and Cloud-Init finished
  block:
    - name: "Wait for SSH handshake to succeed"
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
        sleep: 5

    - name: "Wait for Cloud-Init to finish"
      ansible.builtin.shell: cloud-init status --wait
      become: true
      changed_when: false
      register: cloud_init_result
      until: cloud_init_result is success
      retries: 20  
      delay: 10

- name: Update apt cache (Early stabilization)
  ansible.builtin.apt:
    update_cache: yes
  become: true
  register: apt_res
  until: apt_res is success
  retries: 5
  delay: 5

- name: Install PHP and Web stack
  ansible.builtin.apt:
    name: "{{ php_packages + system_packages }}"
    state: present
  become: true

# ... [Rest of your tasks remain the same] ...

- name: Ensure kevin is in www-data group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: www-data
    append: yes
  become: true

- name: Enable Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: [rewrite, status]
  notify: Restart Apache
  become: true

- name: Configure Apache global options
  ansible.builtin.replace:
    path: /etc/apache2/apache2.conf
    regexp: "(<Directory /var/www/>)\\n(\\s+Options Indexes FollowSymLinks\\n\\s+AllowOverride) None"
    replace: "\\1\\n\\2 All"
  notify: Restart Apache
  become: true
