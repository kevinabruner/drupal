- name: Ensure VM is fully ready and Cloud-Init finished
  block:
    - name: "Wait for SSH handshake to succeed"
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
        sleep: 5

    - name: "Wait for any background apt processes to finish"
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
          sleep 5
        done
      changed_when: false

- name: Install PHP and Web stack
  ansible.builtin.apt:
    name: "{{ php_packages + system_packages }}"
    state: present
  become: true

- name: "Ensure haveged is started and enabled for random seeds"
  become: true
  ansible.builtin.systemd:
    name: haveged
    enabled: true
    state: started

- name: Ensure kevin is in www-data group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: www-data
    append: yes
  become: true

- name: Enable Apache modules
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop: [rewrite, status]
  notify: Restart Apache
  become: true

- name: Configure Apache global options
  ansible.builtin.replace:
    path: /etc/apache2/apache2.conf
    regexp: "(<Directory /var/www/>)\\n(\\s+Options Indexes FollowSymLinks\\n\\s+AllowOverride) None"
    replace: "\\1\\n\\2 All"
  notify: Restart Apache
  become: true
