- name: Prepare build directory
  ansible.builtin.file:
    path: "{{ build_base_path }}/{{ target_app }}/.build"
    state: "{{ item }}"
  loop: [absent, directory]

- name: Copy composer file
  ansible.builtin.copy:
    src: "{{ build_base_path }}/{{ target_app }}/drupal/composer.json"
    dest: "{{ build_base_path }}/{{ target_app }}/.build/composer.json"

- name: Build composer project
  community.general.composer:
    command: install
    working_dir: "{{ build_base_path }}/{{ target_app }}/.build"
    optimize_autoloader: yes
  register: composer_output

- name: Show Composer Output
  ansible.builtin.debug:
    var: composer_output.stdout_lines
  when: composer_output.stdout is defined