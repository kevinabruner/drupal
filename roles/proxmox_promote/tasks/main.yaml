- name: "DEBUG: Show resolved hostnames and available variables"
  debug:
    msg: 
      - "Target App: {{ target_app }}"
      - "Resolved Dev Host: {{ dev_host }}"
      - "Resolved Prod Host: {{ prod_host }}"

- name: "DEBUG: Inspect Dev Host Variables"
  debug:
    var: hostvars[dev_host]
  when: dev_host != 'NOT_FOUND'

- name: "DEBUG: Inspect Prod Host Variables"
  debug:
    var: hostvars[prod_host]
  when: prod_host != 'NOT_FOUND'

- name: "Validate Variables exist"
  assert:
    that:
      - dev_host != 'NOT_FOUND'
      - prod_host != 'NOT_FOUND'
      - hostvars[dev_host].vmid is defined
      - hostvars[prod_host].vmid is defined
    fail_msg: "Required variables (vmid) are missing from the inventory for the resolved hosts."

- name: "Purge existing Prod image {{ new_template_id }}"
  shell: |
    # Bruteforce cleanup of config and disks if they exist
    rm -f /etc/pve/qemu-server/{{ new_template_id }}.conf
    qm destroy {{ new_template_id }} --purge || true
  delegate_to: "{{ pve_node }}"
  failed_when: false

- name: "Clone Dev to Prod ID"
  shell: >
    /usr/sbin/qm clone {{ vmid_to_clone }} {{ new_template_id }} 
    --full --name {{ prod_host }} 
    --storage {{ golden_storage }}
  delegate_to: "{{ pve_node }}"


    