- name: Verify composer was actually ran and its output exists before proceeding
  include_tasks: check-build-dir.yaml

- name: Find and destroy existing golden template on Proxmox
  delegate_to: "{{ pve_node }}"
  remote_user: root
  shell: |
    VMID=$(qm list | grep "{{ target_app }}-golden" | awk '{print $1}')
    if [ -n "$VMID" ]; then
      qm destroy "$VMID" --purge
    fi
  register: destroy_output
  changed_when: "'Destroying' in destroy_output.stdout"

- name: "Bake Gold Image for: {{ target_app }}"
  wescale.hashistack.packer:
    path: "{{ git_dir }}/packer/drupal-golden-image.pkr.hcl"
    var_files:
      - "{{ git_dir }}/packer/variables.pkrvars.hcl"
      - "{{ git_dir }}/packer/secret.pkrvars.hcl"
    vars:
      target_app: "{{ target_app }}"
  register: packer_result
