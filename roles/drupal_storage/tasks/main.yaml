- name: Create Ceph secret file
  ansible.builtin.copy:
    content: "{{ ceph_secret }}"
    dest: "/etc/ceph/{{ ceph_user }}.secret"
    mode: '0600'
  become: true

- name: Ensure mount points exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop:
    - "{{ nfs_target_dir }}"
    - "{{ ceph_target_dir }}"
  become: true

- name: Configure NFS in fstab (Offline)
  ansible.posix.mount:
    path: "{{ nfs_target_dir }}"
    src: "{{ nfs_server }}:{{ nfs_share }}"
    fstype: nfs
    # 'noauto' prevents boot-time mounting during the bake process
    opts: "{{ (nfs_options + ['noauto', '_netdev']) | join(',') }}"
    state: present
  become: true

- name: Configure CephFS in fstab (Offline)
  ansible.posix.mount:
    path: "{{ ceph_target_dir }}"
    src: "{{ ceph_monitors }}:/{{ target_app }}"
    fstype: ceph
    # Adding 'noauto' here as well
    opts: "name={{ ceph_user }},secretfile=/etc/ceph/{{ ceph_user }}.secret,_netdev,noauto"
    state: present
  become: true