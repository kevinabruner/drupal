## 1. Refresh once (Parallel/Fast)
- name: Pre-refresh Terraform state
  delegate_to: terraform
  run_once: true
  command: terraform apply -refresh-only -auto-approve
  args:
    chdir: "/home/kevin/terraform"

## 2. Recreate (Sequential/Fast)
- name: Force Terraform to recreate node
  delegate_to: terraform
  shell: |
    terraform apply \
      -replace='proxmox_vm_qemu.proxmox_vms["{{ inventory_hostname }}"]' \
      -refresh=false \
      -auto-approve
  args:
    chdir: "/home/kevin/terraform"
  throttle: 1  

- name: Ensure VM is fully ready and Cloud-Init finished
  block:
    - name: "Wait for SSH handshake to succeed"
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5
        sleep: 5

    - name: "Wait for Cloud-Init to finish"
      ansible.builtin.shell: cloud-init status --wait
      become: true
      changed_when: false
      register: cloud_init_result
      until: cloud_init_result is success
      retries: 20  
      delay: 10